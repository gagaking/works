<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>作品集管理后台</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#4D7CFF;--purple:#8B5CF6;--bg:#f5f5f0;--card:#fff;--tx:#1a1a1a;--tx2:#666;--bdr:rgba(0,0,0,.08);--green:#22c55e;--red:#ef4444}
body{font-family:'Inter','Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;min-height:100vh}
.header{background:#111;color:#fff;padding:20px 40px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:700;letter-spacing:-.5px}
.header h1 span{color:var(--blue)}
.header-actions{display:flex;gap:12px;align-items:center}
.header-actions a{color:rgba(255,255,255,.5);font-size:12px;text-decoration:none;transition:.2s}
.header-actions a:hover{color:#fff}
.btn{padding:8px 20px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.2s;font-family:inherit}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#3d6cf0}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#16a34a}
.btn-red{background:transparent;color:var(--red);border:1px solid rgba(239,68,68,.2)}.btn-red:hover{background:rgba(239,68,68,.06)}
.btn-outline{background:transparent;color:var(--tx2);border:1px solid var(--bdr)}.btn-outline:hover{border-color:var(--blue);color:var(--blue)}
.toast{position:fixed;bottom:30px;right:30px;background:#111;color:#fff;padding:14px 24px;border-radius:10px;font-size:13px;font-weight:500;transform:translateY(80px);opacity:0;transition:.3s;z-index:999}
.toast.show{transform:none;opacity:1}
.container{max-width:960px;margin:0 auto;padding:30px 24px 80px}
.section{background:var(--card);border-radius:14px;border:1px solid var(--bdr);margin-bottom:20px;overflow:hidden}
.section-head{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr);cursor:pointer;transition:.2s}
.section-head:hover{background:rgba(77,124,255,.02)}
.section-head h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px}
.section-head h2 .num{font-size:11px;color:var(--blue);font-weight:600;background:rgba(77,124,255,.08);padding:3px 8px;border-radius:4px}
.section-head .arrow{transition:transform .3s;color:var(--tx2)}
.section-head.open .arrow{transform:rotate(180deg)}
.section-body{padding:0 24px;max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s}
.section-body.open{max-height:5000px;padding:20px 24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--tx2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:10px 14px;border:1px solid var(--bdr);border-radius:8px;font-size:13px;font-family:inherit;color:var(--tx);background:#fafafa;transition:.2s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,124,255,.08)}
.field textarea{min-height:80px;resize:vertical}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item-card{border:1px solid var(--bdr);border-radius:12px;padding:20px;margin-bottom:14px;position:relative;background:#fafafa;transition:.2s}
.item-card:hover{border-color:rgba(77,124,255,.15)}
.item-card .item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.item-card .item-title{font-size:13px;font-weight:700;color:var(--tx)}
.item-card .item-num{font-size:11px;color:var(--tx2);font-weight:500}
.item-remove{width:28px;height:28px;border-radius:6px;border:1px solid rgba(239,68,68,.15);background:transparent;color:var(--red);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;font-size:16px}
.item-remove:hover{background:rgba(239,68,68,.06)}
.add-btn{width:100%;padding:12px;border:2px dashed rgba(0,0,0,.1);border-radius:10px;background:transparent;color:var(--tx2);font-size:13px;font-weight:500;cursor:pointer;transition:.2s;font-family:inherit}
.add-btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(77,124,255,.02)}
</style>
</head>
<body>
<div class="header">
  <h1>作品集<span>管理后台</span></h1>
  <div class="header-actions">
    <a href="preview.html" target="_blank">预览页面 &#8594;</a>
    <button class="btn btn-red" onclick="resetAll()">重置全部</button>
    <button class="btn btn-green" onclick="saveAll()">保存全部</button>

</div>
<div class="container" id="app"></div>
<div class="toast" id="toast"></div>

function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||JSON.parse(JSON.stringify(DEFAULTS))}catch(e){return JSON.parse(JSON.stringify(DEFAULTS))}}
var data=load();
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}
function saveAll(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));toast('已保存，刷新 preview 页面即可生效')}
function resetAll(){if(!confirm('确定要重置所有数据为默认值吗？'))return;localStorage.removeItem(STORAGE_KEY);data=JSON.parse(JSON.stringify(DEFAULTS));render();toast('已重置为默认数据')}
function render(){
  var a=document.getElementById('app');
  a.innerHTML=sec('首页内容','HOME',rHome)+sec('导航','NAV',rNav)+sec('AI 系统','SYS',rSys)+sec('设计作品','WORKS',rWork)+sec('服务','SERVICES',rSvc)+sec('方法论','METH',rMeth)+sec('技能','SKILLS',rSkill)+sec('成果数据','STATS',rStat);
  document.querySelectorAll('.section-head').forEach(function(h){h.addEventListener('click',function(){h.classList.toggle('open');h.nextElementSibling.classList.toggle('open')})});
  var f=document.querySelector('.section-head');if(f){f.classList.add('open');f.nextElementSibling.classList.add('open')}
}
function sec(label,key,fn){return'<div class="section"><div class="section-head"><h2><span class="num">'+key+'</span>'+label+'</h2><span class="arrow">&#9660;</span></div><div class="section-body">'+fn(key)+'</div></div>'}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function addItem(k,item){data[k].push(item);render();toast('已添加')}
function removeItem(k,i){if(!confirm('确定删除此项？'))return;data[k].splice(i,1);render();toast('已删除')}
function rSys(k){

    h+='<div class="field-row"><div class="field"><label>英文标题 (支持 &lt;br&gt;)</label><input value="'+esc(s.title)+'" onchange="data[\''+k+'\']['+i+'].title=this.value"></div>';
    h+='<div class="field"><label>中文标题</label><input value="'+esc(s.zh)+'" onchange="data[\''+k+'\']['+i+'].zh=this.value"></div></div>';

    h+='<div class="field"><label>解决方案</label><textarea onchange="data[\''+k+'\']['+i+'].solution=this.value">'+esc(s.solution)+'</textarea></div>';
    h+='<div class="field"><label>工作流程 (逗号分隔)</label><input value="'+esc(s.steps.join(', '))+'" onchange="data[\''+k+'\']['+i+'].steps=this.value.split(\',\').map(function(x){return x.trim()})"></div>';
    h+='<div class="field"><label>指标 (每行: 值|标签)</label><textarea onchange="data[\''+k+'\']['+i+'].metrics=this.value.split(\'\\n\').filter(function(x){return x}).map(function(x){var p=l=x.split(\'|\');return{v:p[0].trim(),l:(l[1]||\'\').trim()}})">'+s.metrics.map(function(m){return m.v+'|'+m.l}).join('\n')+'</textarea></div></div>';
  });
  h+='<button class="add-btn" onclick="addItem(\''+k+'\',{id:\'0'+(data[k].length+1)+'\',title:\'New System<br>System\',zh:\'新系统\',vis:\'batch\',problem:\'描述问题\',solution:\'描述解决方案\',steps:[\'Step 1\',\'Step 2\',\'Step 3\'],metrics:[{v:\'0\',l:\'指标\'},{v:\'0\',l:\'指标\'},{v:\'0\',l:\'指标\'},{v:\'0\',l:\'指标\'}]})">+ 添加 AI 系统</button>';
  return h;
}

function rSkill(k){
